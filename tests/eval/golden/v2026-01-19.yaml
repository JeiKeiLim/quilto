# E2E Evaluation Golden Dataset
# Version: v2026-01-19
# Created by: Story 10.1 - Create E2E Evaluation Dataset
#
# This dataset contains 50 test cases for pairwise LLM-as-judge evaluation
# comparing Quilto agent responses to baseline (Claude) responses.
---
version: "2026-01-19"
domain: "fitness"
case_count: 50
created_by: "Story 10.1"
categories:
  simple: 3
  complex: 4
  insufficient: 3
  retrieval: 10
  reasoning: 10
  edge: 10
  domain: 10

test_cases:
  # =============================================================================
  # EXTENDED FROM EXISTING CORPUS (10 cases)
  # Source: tests/corpus/fitness/expected/query/
  # =============================================================================

  # --- Simple Category (3 cases) ---

  - id: "simple-bench-progression"
    category: "simple"
    source: "tests/corpus/fitness/expected/query/simple-bench-progression.json"
    query: "How has my bench press progressed?"
    context_entries: ["2019-01-29", "2019-02-01", "2019-03-12"]
    rubric_criteria: ["accuracy", "completeness", "domain_expertise"]
    evaluation_hints:
      should_mention:
        - "weight progression over time"
        - "weights ranging from 55kg to 85kg across sessions"
        - "drop sets pattern (starting high, reducing weight)"
        - "time span covered (Jan-Mar 2019)"
      should_not:
        - "fabricate weights not in context"
        - "claim steady linear progression (data shows variable weights with drop sets)"

  - id: "simple-heaviest-deadlift"
    category: "simple"
    source: "tests/corpus/fitness/expected/query/simple-heaviest-deadlift.json"
    query: "What was my heaviest deadlift?"
    context_entries: ["2019-01-28"]
    rubric_criteria: ["accuracy", "completeness"]
    evaluation_hints:
      should_mention:
        - "trap bar deadlift 190kg"
        - "specific date (2019-01-28)"
      should_not:
        - "confuse with conventional deadlift"
        - "make up heavier weights"

  - id: "simple-september-frequency"
    category: "simple"
    source: "tests/corpus/fitness/expected/query/simple-september-frequency.json"
    query: "Show my workout frequency in September 2019"
    context_entries:
      - "2019-09-02"
