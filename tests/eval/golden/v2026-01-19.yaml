      - "2019-09-05"
      - "2019-09-06"
      - "2019-09-09"
      - "2019-09-10"
      - "2019-09-16"
      - "2019-09-17"
      - "2019-09-18"
      - "2019-09-19"
      - "2019-09-21"
      - "2019-09-23"
      - "2019-09-24"
      - "2019-09-26"
      - "2019-09-27"
      - "2019-09-30"
    rubric_criteria: ["accuracy", "completeness"]
    evaluation_hints:
      should_mention:
        - "16 workout days in September"
        - "consistent training pattern"
        - "multiple consecutive days"
      should_not:
