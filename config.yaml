# Quilto Unified Configuration - SAMPLE CONFIG
# =============================================
# This is a sample configuration for local development.
# Copy this file or use these values when implementing LLM-using agents.
#
# MINIMUM REQUIREMENT: qwen2.5:7b (or equivalent)
# Smaller models (e.g., 3b) are unreliable for structured JSON output
# and will fail to include required fields in agent responses.
#
# Qwen2.5 is recommended because it explicitly supports structured JSON output,
# which is required for Parser and other agents that return Pydantic models.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  default_provider: "ollama"
  # fallback_provider: "anthropic"  # Uncomment when ANTHROPIC_API_KEY is set

  providers:
    ollama:
      api_base: "http://localhost:11434"
      timeout: 120.0  # Longer timeout for local Ollama (default is 45s)
    # anthropic:
    #   api_key: "${ANTHROPIC_API_KEY}"

  # Model tiers - matched to 16GB RAM constraint
  # All tiers use 7b minimum - smaller models unreliable for structured output
  tiers:
    low:
      ollama: "qwen2.5:7b"
      # anthropic: "claude-3-haiku-20240307"
    medium:
      ollama: "qwen2.5:7b"
      # anthropic: "claude-3-5-sonnet-20241022"
    high:
      ollama: "qwen2.5:7b"
      # anthropic: "claude-3-5-sonnet-20241022"

  # Agent tier assignments
  agents:
    router:
      tier: low
    parser:
      tier: medium
    planner:
      tier: medium
    retriever:
      tier: low
    analyzer:
      tier: high
    synthesizer:
      tier: high
    evaluator:
      tier: medium
    clarifier:
      tier: low
    observer:
      tier: medium

# =============================================================================
# Observability Configuration (Optional)
# =============================================================================
# Enable LLM tracing via Langfuse for debugging and performance analysis.
# Requires Langfuse credentials (see .env.example for setup).
observability:
  enabled: true
  provider: langfuse  # langfuse | noop
  sample_rate: 1.0
  # Credentials are loaded from environment variables:
  # - LANGFUSE_PUBLIC_KEY
  # - LANGFUSE_SECRET_KEY
  # - LANGFUSE_BASE_URL
